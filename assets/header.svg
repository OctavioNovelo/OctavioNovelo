<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 240" width="1000" height="240" role="img" aria-label="Octavio Novelo - Ciberseguridad, Electrónica, Software" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <style>
    .bg    { fill: #f6f8fa; }
    .minor { stroke: #d8dee4; }
    .major { stroke: #c4ccd4; }
    .frame { stroke: #afb8c1; fill: none; }
    .line  { stroke: #57606a; fill: none; }
    .solid { fill: #f6f8fa; stroke: #57606a; }
    .ink   { fill: #1f2328; }
    .sub   { fill: #57606a; }
    .acc   { fill: #bc4c00; }
    .accs  { stroke: #bc4c00; fill: none; }
    .sans  { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif; }
    @media (prefers-color-scheme: dark) {
      .bg    { fill: #0d1117; }
      .minor { stroke: #1b222c; }
      .major { stroke: #2a3340; }
      .frame { stroke: #3d4654; }
      .line  { stroke: #8b949e; }
      .solid { fill: #0d1117; stroke: #8b949e; }
      .ink   { fill: #e6edf3; }
      .sub   { fill: #8b949e; }
      .acc   { fill: #f0883e; }
      .accs  { stroke: #f0883e; }
    }
  </style>
  <defs>
    <pattern id="minor" width="20" height="20" patternUnits="userSpaceOnUse">
      <path class="minor" d="M20 0H0V20" fill="none" stroke-width="0.6"/>
    </pattern>
    <pattern id="major" width="100" height="100" patternUnits="userSpaceOnUse">
      <path class="major" d="M100 0H0V100" fill="none" stroke-width="0.8"/>
    </pattern>
  </defs>

  <rect class="bg" width="1000" height="240" rx="12"/>
  <rect width="1000" height="240" rx="12" fill="url(#minor)"/>
  <rect width="1000" height="240" rx="12" fill="url(#major)"/>
  <rect class="frame" x="12" y="12" width="976" height="216" rx="6" stroke-width="1"/>

  <!-- texto -->
  <text class="ink sans" x="60" y="108" font-size="56" font-weight="700" letter-spacing="-1">Octavio Novelo</text>
  <rect class="acc" x="62" y="126" width="56" height="4" rx="2"/>
  <text class="sub sans" x="60" y="168" font-size="21">Ciberseguridad · Electrónica · Software</text>

  <!-- diagrama de red: un paquete viaja hasta un servidor protegido -->
  <g>
    <!-- enlaces -->
    <path class="line" d="M556 162 L626 98 M626 98 L700 160 M626 98 L640 204 M556 162 L640 204" stroke-width="1.3"/>
    <path class="accs" d="M556 162 L626 98 L700 160" stroke-width="1.3" stroke-dasharray="5 4" opacity="0.7"/>

    <!-- host -->
    <rect class="solid" x="544" y="154" width="24" height="17" rx="2.5" stroke-width="1.5"/>
    <path class="line" d="M549 176H563" stroke-width="1.5"/>

    <!-- router -->
    <circle class="solid" cx="626" cy="98" r="11" stroke-width="1.5"/>
    <path class="line" d="M619 98H633M626 91V105" stroke-width="1.1"/>

    <!-- host auxiliar -->
    <circle class="solid" cx="640" cy="204" r="7" stroke-width="1.5"/>

    <!-- servidor con candado (objetivo protegido) -->
    <rect class="solid accs" x="686" y="146" width="30" height="26" rx="3" stroke-width="1.8"/>
    <rect class="acc" x="696" y="156" width="10" height="8" rx="1.5"/>
    <path class="accs" d="M698.5 156v-2.5a2.5 2.5 0 0 1 5 0V156" stroke-width="1.5"/>

    <!-- paquete -->
    <circle class="acc" r="3.6">
      <animateMotion dur="4.5s" repeatCount="indefinite" path="M556 162 L626 98 L700 160" keyPoints="0;1" keyTimes="0;1" calcMode="linear"/>
    </circle>
  </g>

  <!-- dibujo técnico: órbita (hardware) -->
  <g transform="translate(868 120)">
    <path class="line" d="M-100 0H100M0 -78V78" stroke-width="0.8" stroke-dasharray="10 4 2 4" opacity="0.55"/>
    <circle class="line" r="28" stroke-width="1.6"/>
    <ellipse class="line" rx="28" ry="9" stroke-width="0.8" opacity="0.6"/>
    <g transform="rotate(-18)">
      <ellipse class="line" rx="92" ry="38" stroke-width="1" stroke-dasharray="4 5"/>
      <g>
        <rect class="acc" x="-6" y="-4" width="12" height="8" rx="1.5"/>
        <rect class="accs" x="-16" y="-2.5" width="8" height="5" stroke-width="1.2"/>
        <rect class="accs" x="8" y="-2.5" width="8" height="5" stroke-width="1.2"/>
        <animateMotion dur="26s" repeatCount="indefinite" path="M -92 0 A 92 38 0 1 1 92 0 A 92 38 0 1 1 -92 0"/>
      </g>
    </g>
  </g>
</svg>
