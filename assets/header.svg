<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 240" width="1000" height="240" role="img" aria-label="Octavio Novelo - Ciberseguridad, Electrónica, Software" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <style>
    .bg    { fill: #f6f8fa; }
    .minor { stroke: #d8dee4; }
    .major { stroke: #c4ccd4; }
    .frame { stroke: #afb8c1; fill: none; }
    .line  { stroke: #57606a; fill: none; }
    .ink   { fill: #1f2328; }
    .sub   { fill: #57606a; }
    .acc   { fill: #bc4c00; }
    .accs  { stroke: #bc4c00; fill: none; }
    .sans  { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif; }
    .mono  { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, 'DejaVu Sans Mono', monospace; }
    @media (prefers-color-scheme: dark) {
      .bg    { fill: #0d1117; }
      .minor { stroke: #1b222c; }
      .major { stroke: #2a3340; }
      .frame { stroke: #3d4654; }
      .line  { stroke: #8b949e; }
      .ink   { fill: #e6edf3; }
      .sub   { fill: #8b949e; }
      .acc   { fill: #f0883e; }
      .accs  { stroke: #f0883e; }
    }
  </style>
  <defs>
    <pattern id="minor" width="20" height="20" patternUnits="userSpaceOnUse">
      <path class="minor" d="M20 0H0V20" fill="none" stroke-width="0.6"/>
    </pattern>
    <pattern id="major" width="100" height="100" patternUnits="userSpaceOnUse">
      <path class="major" d="M100 0H0V100" fill="none" stroke-width="0.8"/>
    </pattern>
  </defs>

  <rect class="bg" width="1000" height="240" rx="12"/>
  <rect width="1000" height="240" rx="12" fill="url(#minor)"/>
  <rect width="1000" height="240" rx="12" fill="url(#major)"/>
  <rect class="frame" x="12" y="12" width="976" height="216" rx="6" stroke-width="1"/>

  <!-- texto -->
  <text class="ink sans" x="60" y="108" font-size="56" font-weight="700" letter-spacing="-1">Octavio Novelo</text>
  <rect class="acc" x="62" y="126" width="56" height="4" rx="2"/>
  <text class="sub sans" x="60" y="168" font-size="21">Ciberseguridad · Electrónica · Software</text>

  <!-- dibujo técnico: órbita del CanSat -->
  <g transform="translate(810 120)">
    <path class="line" d="M-150 0H150M0 -90V90" stroke-width="0.8" stroke-dasharray="10 4 2 4" opacity="0.55"/>
    <circle class="line" r="34" stroke-width="1.6"/>
    <ellipse class="line" rx="34" ry="11" stroke-width="0.8" opacity="0.6"/>
    <g transform="rotate(-18)">
      <ellipse class="line" rx="124" ry="48" stroke-width="1" stroke-dasharray="4 5"/>
      <g>
        <rect class="acc" x="-6" y="-4" width="12" height="8" rx="1.5"/>
        <rect class="accs" x="-16" y="-2.5" width="8" height="5" stroke-width="1.2"/>
        <rect class="accs" x="8" y="-2.5" width="8" height="5" stroke-width="1.2"/>
        <animateMotion dur="26s" repeatCount="indefinite" path="M -124 0 A 124 48 0 1 1 124 0 A 124 48 0 1 1 -124 0"/>
      </g>
    </g>
  </g>
  <text class="sub mono" x="958" y="206" font-size="12" text-anchor="end" letter-spacing="1">CanSat · 2027</text>
</svg>
