<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 300" width="1000" height="300" role="img" aria-label="Octavio Novelo - Ciberseguridad, Hardware, Software" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#00ff9c"/>
      <stop offset="1" stop-color="#00b3ff"/>
    </linearGradient>
    <linearGradient id="line" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#00ff9c" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#00ff9c"/>
      <stop offset="1" stop-color="#00b3ff" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="planet" cx="0.35" cy="0.35" r="0.8">
      <stop offset="0" stop-color="#12304a"/>
      <stop offset="1" stop-color="#07101c"/>
    </radialGradient>
    <radialGradient id="vignette" cx="0.5" cy="0.5" r="0.75">
      <stop offset="0.55" stop-color="#0d1117" stop-opacity="0"/>
      <stop offset="1" stop-color="#05080c" stop-opacity="0.9"/>
    </radialGradient>
    <pattern id="grid" width="30" height="30" patternUnits="userSpaceOnUse">
      <path d="M30 0H0V30" fill="none" stroke="#00ff9c" stroke-opacity="0.06" stroke-width="1"/>
    </pattern>
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="3" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <style>
    .mono { font-family: 'Fira Code','JetBrains Mono','SF Mono',Menlo,Consolas,'DejaVu Sans Mono','Courier New',monospace; }
    .trace { fill: none; stroke: #00ff9c; stroke-opacity: .16; stroke-width: 2; }
    .pulse { fill: none; stroke: #00ff9c; stroke-width: 2.5; stroke-linecap: round; stroke-dasharray: 26 420; filter: url(#glow); animation: flow 3.4s linear infinite; }
    .pulse.b { stroke: #00b3ff; animation-duration: 4.2s; animation-delay: -1.3s; }
    .pulse.c { animation-delay: -2.1s; }
    @keyframes flow { from { stroke-dashoffset: 446; } to { stroke-dashoffset: 0; } }
    .node { fill: #00ff9c; animation: nodePulse 2.2s ease-in-out infinite; }
    .node.b { fill: #00b3ff; animation-delay: -1.1s; }
    @keyframes nodePulse { 0%,100% { opacity: .25; } 50% { opacity: 1; } }

    .glitchA { fill: #00b3ff; opacity: 0; animation: gA 5s steps(1) infinite; }
    .glitchB { fill: #ff2e88; opacity: 0; animation: gB 5s steps(1) infinite; }
    @keyframes gA { 0%,90%,100% { opacity:0; transform: translate(0,0); } 91% { opacity:.85; transform: translate(-5px,1px); } 93% { opacity:.85; transform: translate(4px,-1px); } 95% { opacity:.6; transform: translate(-2px,0); } 97% { opacity:0; } }
    @keyframes gB { 0%,90%,100% { opacity:0; transform: translate(0,0); } 92% { opacity:.8; transform: translate(5px,-1px); } 94% { opacity:.8; transform: translate(-4px,1px); } 96% { opacity:.5; transform: translate(2px,0); } 98% { opacity:0; } }
    .cur { animation: blink 1s steps(1) infinite; }
    .nocur { fill: none; }
    @keyframes blink { 0%,49% { opacity: 1; } 50%,100% { opacity: 0; } }

    .w { font-size: 16px; letter-spacing: 3px; font-weight: 600; fill: #5d6b78; animation: hl 6s linear infinite; }
    .w2 { animation-delay: -4s; }
    .w3 { animation-delay: -2s; }
    @keyframes hl { 0%,33% { fill: #00ff9c; } 34%,100% { fill: #5d6b78; } }
    .sep { font-size: 17px; fill: #00b3ff; opacity: .6; }
    .tiny { font-size: 11px; letter-spacing: 2px; fill: #00ff9c; opacity: .55; }
    .dot { animation: blink 1.4s steps(1) infinite; }
    .scan { animation: scan 3.2s ease-in-out infinite alternate; }
    @keyframes scan { from { transform: translateX(0); } to { transform: translateX(380px); } }
  </style>

  <!-- fondo -->
  <rect width="1000" height="300" fill="#0d1117"/>
  <rect width="1000" height="300" fill="url(#grid)"/>

  <!-- pistas de circuito -->
  <g>
    <path class="trace" d="M0 40 H230 L262 72 H500"/>
    <path class="trace" d="M1000 40 H770 L738 72 H560"/>
    <path class="trace" d="M0 262 H250 L282 230 H440"/>
    <path class="trace" d="M1000 262 H750 L718 230 H590"/>
    <path class="pulse"   d="M0 40 H230 L262 72 H500"/>
    <path class="pulse b" d="M1000 40 H770 L738 72 H560"/>
    <path class="pulse c" d="M0 262 H250 L282 230 H440"/>
    <path class="pulse b" d="M1000 262 H750 L718 230 H590" style="animation-delay:-3s"/>
    <circle class="node"   cx="500" cy="72"  r="4"/>
    <circle class="node b" cx="560" cy="72"  r="4"/>
    <circle class="node b" cx="440" cy="230" r="4"/>
    <circle class="node"   cx="590" cy="230" r="4"/>
  </g>

  <!-- RADAR (ciberseguridad) -->
  <g transform="translate(120 150)">
    <circle r="80" fill="#00ff9c" fill-opacity="0.03" stroke="#00ff9c" stroke-opacity="0.45"/>
    <circle r="53" fill="none" stroke="#00ff9c" stroke-opacity="0.28"/>
    <circle r="26" fill="none" stroke="#00ff9c" stroke-opacity="0.28"/>
    <path d="M-80 0H80M0 -80V80" stroke="#00ff9c" stroke-opacity="0.25"/>
    <g>
      <path d="M0 0 L80 0 A80 80 0 0 0 69.3 -40 Z" fill="#00ff9c" fill-opacity="0.22"/>
      <line x1="0" y1="0" x2="80" y2="0" stroke="#00ff9c" stroke-width="2" filter="url(#glow)"/>
      <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="4s" repeatCount="indefinite"/>
    </g>
    <circle cx="35" cy="-35" r="4" fill="#ff2e88" opacity="0" filter="url(#glow)">
      <animate attributeName="opacity" values="1;0" dur="4s" begin="3.5s" repeatCount="indefinite"/>
    </circle>
    <circle cx="-30" cy="38" r="3.5" fill="#00b3ff" opacity="0" filter="url(#glow)">
      <animate attributeName="opacity" values="1;0" dur="4s" begin="1.5s" repeatCount="indefinite"/>
    </circle>
    <circle cx="22" cy="48" r="3" fill="#00ff9c" opacity="0" filter="url(#glow)">
      <animate attributeName="opacity" values="1;0" dur="4s" begin="0.75s" repeatCount="indefinite"/>
    </circle>
    <circle r="3" fill="#00ff9c"/>
  </g>

  <!-- ORBITA (hardware / CanSat) -->
  <g transform="translate(880 150)">
    <circle r="36" fill="url(#planet)" stroke="#00b3ff" stroke-opacity="0.6"/>
    <ellipse rx="36" ry="12" fill="none" stroke="#00b3ff" stroke-opacity="0.25"/>
    <ellipse rx="36" ry="24" fill="none" stroke="#00b3ff" stroke-opacity="0.18"/>
    <path d="M0 -36V36" stroke="#00b3ff" stroke-opacity="0.2"/>
    <g transform="rotate(-20)">
      <ellipse rx="104" ry="42" fill="none" stroke="#00ff9c" stroke-opacity="0.45" stroke-dasharray="3 6"/>
      <g filter="url(#glow)">
        <rect x="-5" y="-3.5" width="10" height="7" rx="1.5" fill="#00ff9c"/>
        <rect x="-15" y="-2" width="8" height="4" fill="#00b3ff"/>
        <rect x="7" y="-2" width="8" height="4" fill="#00b3ff"/>
        <animateMotion dur="7s" repeatCount="indefinite" path="M -104 0 A 104 42 0 1 1 104 0 A 104 42 0 1 1 -104 0"/>
      </g>
    </g>
  </g>

  <!-- esquinas tipo HUD -->
  <circle class="dot" cx="26" cy="22" r="3.5" fill="#00ff9c"/>
  <text class="mono tiny" x="38" y="26">SYS::ONLINE</text>
  <text class="mono tiny" x="974" y="26" text-anchor="end">CANSAT-2027 // TELEMETRIA</text>
  <text class="mono tiny" x="26" y="288">&gt; hack --ethical</text>
  <text class="mono tiny" x="974" y="288" text-anchor="end">HERA :: RECON / AUDIT</text>

  <!-- NOMBRE con glitch -->
  <g class="mono" font-size="50" font-weight="700" letter-spacing="4" text-anchor="middle">
    <text class="glitchA" x="500" y="150">OCTAVIO NOVELO<tspan class="nocur">_</tspan></text>
    <text class="glitchB" x="500" y="150">OCTAVIO NOVELO<tspan class="nocur">_</tspan></text>
    <text x="500" y="150" fill="url(#g)" filter="url(#glow)">OCTAVIO NOVELO<tspan class="cur" fill="#00ff9c">_</tspan></text>
  </g>

  <!-- subtitulo que se ilumina por turnos -->
  <g class="mono">
    <text class="w w1" x="246" y="190" textLength="200" lengthAdjust="spacing">CIBERSEGURIDAD</text>
    <text class="sep" x="460" y="190">//</text>
    <text class="w w2" x="492" y="190" textLength="104" lengthAdjust="spacing">HARDWARE</text>
    <text class="sep" x="624" y="190">//</text>
    <text class="w w3" x="656" y="190" textLength="104" lengthAdjust="spacing">SOFTWARE</text>
  </g>

  <!-- barra de escaneo -->
  <rect x="262" y="206" width="476" height="2" fill="url(#line)" opacity="0.35"/>
  <rect class="scan" x="262" y="205" width="90" height="4" rx="2" fill="url(#line)" filter="url(#glow)"/>

  <rect width="1000" height="300" fill="url(#vignette)"/>
</svg>
